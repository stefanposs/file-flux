# ==============================================================================
# FileFlux — Dependency Updates (Dependabot)
# ==============================================================================

version: 2
updates:
  # Backend Go modules
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "deps(backend):"
    open-pull-requests-limit: 5

  # Agent Go modules
  - package-ecosystem: gomod
    directory: /agent
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - agent
    commit-message:
      prefix: "deps(agent):"
    open-pull-requests-limit: 5

  # Frontend NPM packages
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "deps(frontend):"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "deps(ci):"
    open-pull-requests-limit: 5

  # Python (MkDocs) — pip
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docs
    commit-message:
      prefix: "deps(docs):"
    open-pull-requests-limit: 3
