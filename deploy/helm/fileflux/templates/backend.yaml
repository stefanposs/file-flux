apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fileflux.fullname" . }}-backend
  labels:
    {{- include "fileflux.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "fileflux.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "fileflux.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
            - name: websocket
              containerPort: 3002
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: {{ .Values.backend.env.serverPort | quote }}
            - name: WEBSOCKET_PORT
              value: {{ .Values.backend.env.websocketPort | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.backend.env.logLevel | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.backend.env.logFormat | quote }}
            - name: ENV
              value: "production"
            - name: DB_HOST
              value: {{ if .Values.postgres.enabled }}{{ include "fileflux.fullname" . }}-postgres{{ else }}{{ .Values.postgres.external.host }}{{ end }}
            - name: DB_PORT
              value: {{ if .Values.postgres.enabled }}"5432"{{ else }}{{ .Values.postgres.external.port | quote }}{{ end }}
            - name: DB_SSLMODE
              value: {{ .Values.backend.env.dbSslMode | quote }}
          envFrom:
            - secretRef:
                name: {{ include "fileflux.fullname" . }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fileflux.fullname" . }}-backend
  labels:
    {{- include "fileflux.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3001
      targetPort: http
    - name: websocket
      port: 3002
      targetPort: websocket
  selector:
    {{- include "fileflux.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
