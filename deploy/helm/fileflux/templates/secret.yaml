apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fileflux.fullname" . }}
  labels:
    {{- include "fileflux.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.secrets.dbUser | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  DB_NAME: {{ .Values.secrets.dbName | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  AGENT_TOKEN: {{ .Values.secrets.agentToken | quote }}
