# ==============================================================================
# File Flux — Prometheus Configuration
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # ── File Flux Backend ────────────────────────────────────────────────────
  - job_name: "fileflux-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3001"]
        labels:
          service: "backend"
          environment: "production"

  # ── Prometheus self-monitoring ───────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── PostgreSQL (optional, requires postgres_exporter sidecar) ────────────
  # - job_name: "postgres"
  #   static_configs:
