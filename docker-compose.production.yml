# ==============================================================================
# File Flux — Production Docker Compose (with TLS + Monitoring)
# ==============================================================================
# Usage:
#   cp .env.example .env                         # configure secrets & domain
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.production.yml up -d
# ==============================================================================

services:
  # ── Reverse Proxy (TLS termination) ───────────────────────────────────────
  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy-net"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--accesslog=true"
      - "--accesslog.format=json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt-data:/letsencrypt
    networks:
      - proxy-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Override: Backend ─────────────────────────────────────────────────────
  backend:
    ports: []  # remove host port binding, only expose through traefik
    labels:
      - "traefik.enable=true"
      # API
      - "traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=3001"
      # WebSocket
      - "traefik.http.routers.ws.rule=Host(`${DOMAIN}`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.ws.entrypoints=websecure"
      - "traefik.http.routers.ws.tls.certresolver=letsencrypt"
      - "traefik.http.services.ws.loadbalancer.server.port=3002"
    networks:
      - backend-net
      - frontend-net
      - proxy-net

  # ── Override: Frontend ────────────────────────────────────────────────────
  frontend:
    ports: []  # remove host port binding
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - frontend-net
      - proxy-net

  # ── Override: Database (production tuning) ────────────────────────────────
  db:
    command:
      - "postgres"
      - "-c" 
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "log_statement=mod"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-backups:/backups

  # ── Monitoring: Prometheus ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ── Monitoring: Grafana ───────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://${DOMAIN}/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${DOMAIN}`) && PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend-net
      - proxy-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ── Database Backups ──────────────────────────────────────────────────────
  db-backup:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PGHOST=db
      - PGUSER=${DB_USER:-fileflux}
      - PGPASSWORD=${DB_PASSWORD:-fileflux}
      - PGDATABASE=${DB_NAME:-fileflux}
    volumes:
      - postgres-backups:/backups
    entrypoint: >
      /bin/sh -c "
        pg_dump -Fc > /backups/fileflux-$$(date +%Y%m%d-%H%M%S).dump &&
        echo 'Backup complete' &&
        find /backups -name '*.dump' -mtime +7 -delete
      "
    networks:
      - backend-net
    profiles:
      - backup

volumes:
  letsencrypt-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  postgres-backups:
    driver: local

networks:
  proxy-net:
    driver: bridge
